name: ci
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run eslint

      - name: Lint (stylelint)
        # 49 pre-existing findings in term.css/timer.css/app.scss predate this
        # pipeline (inherited from upstream, not from any change going through
        # CI) -- report but don't block until that backlog is cleaned up.
        run: npm run stylelint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload built dist/
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
